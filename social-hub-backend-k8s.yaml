apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-hub-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-hub-backend
  template:
    metadata:
      labels:
        app: social-hub-backend
    spec:
      containers:
      - name: backend
        image: your-registry/social-hub-backend:latest  # Update with your Docker registry
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://social_hub_lkep_user:H47L8VauGN4qSmgq9wl3nQrBcVgSgVOV@dpg-d504ov7gi27c73dgdq2g-a.virginia-postgres.render.com/social_hub_lkep"
        - name: ROCKET_CHAT_URL
          value: "http://10.68.0.49:30082"
        - name: ROCKET_CHAT_USER_ID
          value: "K8MHCfESxc7zJrdg3"
        - name: ROCKET_CHAT_AUTH_TOKEN
          value: "S4j_j25SJLVeQmwySRVc1-O-S7QIa6yK7zuKDgO1L9_"
        - name: SECRET_KEY
          value: "your-secret-key-here"
        - name: ALGORITHM
          value: "HS256"
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          value: "30"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: social-hub-backend
  namespace: default
spec:
  type: NodePort
  selector:
    app: social-hub-backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30083  # Choose an available port
    protocol: TCP
